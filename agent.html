<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>TripBudget - Agent</title>
    <style>
        * {
            margin: 0;
          padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8fafc;
            color: #0f172a;
        }

        .navbar {
            background: #0f172a;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            color: white;
            font-size: 25px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }

        .container {
            max-width: 850px;
            margin: 50px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }       
        .destination {
            color: #2563eb;
            font-weight: bold;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input,
        select {
            width: 100%;
            padding: 14px;
            margin-bottom: 22px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            ✈ TripBudget
        </div>
        <div class="nav-links">
            <a href="{{ url_for('index') }}">Home</a>
            <a href="{{ url_for('destination') }}">
                Destination
            </a>
            <a href="{{ url_for('agent') }}">
                Agent
            </a>
            <a href="{{ url_for('planner') }}">
                Planner
            </a>
            <a href="{{ url_for('analysis') }}">
                Analysis
            </a>
            <a href="{{ url_for('daywise') }}">
                Day Plan
            </a>
            <a href="{{ url_for('summary') }}">
                Summary
            </a>
        </div>
    </nav>
    <div class="container">
        <div class="card">
            <h1>
                Travel Agent
            </h1>
            <p class="destination">
                📍 {{ destination }}
            </p>
            <form method="POST">
                <label>
                    Your Name
                </label>
                <input
                    type="text"
                    name="name"
                    placeholder="Enter your name"
                    required>
                <label>
                    Number of Travelers
                </label>
                <input
                    type="number"
                    name="travelers"
                    min="1"
                    max="50"
                    value="1"
                    required>
                <label>
                    Travel Style
                </label>
                <select name="travel_style">
                    <option value="Budget">
                        Budget
                    </option>
                    <option value="Comfort">
                        Comfort
                    </option>
                    <option value="Luxury">
                        Luxury
                    </option>
                </select>
                <label>
                    Transportation
                </label>
                <select name="transport">
                    <option value="Bus">
                        Bus
                    </option>
                    <option value="Train" selected>
                        Train
                    </option>
                    <option value="Flight">
                        Flight
                    </option>
                    <option value="Car">
                        Car
                    </option>
                </select>
                <label>
                    Accommodation
                </label>
                <select name="accommodation">
                    <option value="Hotel">
                        Hotel
                    </option>
                    <option value="Hostel">
                        Hostel
                    </option>
                    <option value="Resort">
                        Resort
                    </option>
                    <option value="Homestay">
                        Homestay
                    </option>
                </select>
                <button type="submit">
                    Continue to Planner →
                </button>
            </form>
        </div>
    </div>
</body>
</html>
