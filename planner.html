<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>TripBudget - Planner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #0f172a;
        }
        .navbar {
            background: #0f172a;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .logo {
            color: white;
            font-size: 25px;
            font-weight: bold;
        }
        .nav-links {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
        .container {
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }
        .info {
            color: #2563eb;
            font-weight: bold;
            margin-bottom: 30px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .full {
            grid-column: 1 / 3;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }
        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 20px;
        }
        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }
        @media (max-width: 650px) {
            .grid {
                grid-template-columns: 1fr;
            }
            .full {
                grid-column: auto;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            ✈ TripBudget
        </div>
        <div class="nav-links">
            <a href="{{ url_for('index') }}">Home</a>
            <a href="{{ url_for('destination') }}">
                Destination
            </a>
            <a href="{{ url_for('agent') }}">
                Agent
            </a>
            <a href="{{ url_for('planner') }}">
                Planner
            </a>
            <a href="{{ url_for('analysis') }}">
                Analysis
            </a>
            <a href="{{ url_for('daywise') }}">
                Day Plan
            </a>
            <a href="{{ url_for('summary') }}">
                Summary
            </a>
        </div>
    </nav>
    <div class="container">
        <div class="card">
            <h1>
                Budget Planner
            </h1>
            <p class="info">
                {{ destination }}
                |
                {{ travelers }} Traveler(s)
                |
                {{ travel_style }}
            </p>
            <form method="POST">
                <div class="grid">
                    <div class="full">
                        <label>
                            Travel Start Date
                        </label>
                        <input
                            type="date"
                            name="start_date"
                            required>
                    </div>
                    <div>
                        <label>
                            Number of Days
                        </label>
                        <input
                            type="number"
                            name="days"
                            min="1"
                            max="30"
                            value="3"
                            required>
                    </div>
                    <div>
                        <label>
                            Daily Food Budget (₹)
                        </label>
                        <input
                            type="number"
                            name="food_budget"
                            min="0"
                            value="1000"
                            required>
                    </div>
                    <div>
                        <label>
                            Daily Activity Budget (₹)
                        </label>
                        <input
                            type="number"
                            name="activity_budget"
                            min="0"
                            value="1000"
                            required>
                    </div>
                    <div>
                        <label>
                            Hotel Cost Per Day (₹)
                        </label>
                        <input
                            type="number"
                            name="hotel_budget"
                            min="0"
                            value="2000"
                            required>
                    </div>
                    <div class="full">
                        <button type="submit">
                            Calculate My Budget →
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
